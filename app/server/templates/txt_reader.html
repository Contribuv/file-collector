<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>{{ filename }} - 阅读</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/txt_reader.css', v=VERSION) }}">
</head>
<body data-theme="light" data-mode="scroll">

<div class="tr-topbar" id="tr-topbar">
  <span class="fn" id="tr-fn">{{ filename }}</span>
  <span class="chapter-label" id="tr-chapter-label"></span>
  <span class="progress-pct" id="tr-progress-pct"></span>
  <span class="sep"></span>
  <button id="btn-prev" type="button" title="上一页" class="btn-icon">‹</button>
  <button id="btn-next" type="button" title="下一页" class="btn-icon">›</button>
  <span class="sep"></span>
  <button id="btn-font-minus" type="button" title="缩小字号">A-</button>
  <button id="btn-font-plus" type="button" title="放大字号">A+</button>
  <button id="btn-line-height" type="button" title="切换行高">行高</button>
  <span class="sep"></span>
  <button id="btn-toc" type="button" title="章节目录">目录</button>
  <button id="btn-mode" type="button" title="切换翻页/滚动模式">翻页</button>
  <button id="btn-theme" type="button" title="切换主题">主题</button>
  <button id="btn-settings" type="button" title="阅读设置">设置</button>
</div>

<div class="tr-toc-overlay" id="toc-overlay"></div>
<div class="tr-toc-panel" id="toc-panel">
  <div class="tr-toc-header">
    章节目录
    <button type="button" class="close-btn" id="toc-close" title="关闭">✕</button>
  </div>
  <div class="tr-toc-list" id="toc-list"></div>
</div>

<div class="tr-loading" id="loading">
  <div class="spinner"></div>
  <div class="progress-text" id="progress">加载中...</div>
</div>

<div class="tr-error" id="error">
  <div class="err-icon">!</div>
  <div class="err-title" id="err-title">加载失败</div>
  <div class="err-desc" id="err-desc">无法读取文件内容</div>
</div>

<div class="tr-view" id="view">
  <div class="tr-content" id="content"></div>
</div>

<div class="tr-page-indicator" id="page-indicator">1 / 1</div>
<div class="tr-tap-left" id="tap-left"></div>
<div class="tr-tap-right" id="tap-right"></div>

<div class="tr-settings-overlay" id="settings-overlay"></div>
<div class="tr-settings" id="settings-panel">
  <div class="tr-settings-title">
    阅读设置
    <button type="button" class="close-btn" id="settings-close" title="关闭">✕</button>
  </div>
  <div class="tr-setting-row">
    <div class="tr-setting-label">字号</div>
    <div class="tr-setting-controls">
      <button type="button" id="fs-minus">A-</button>
      <span class="value" id="fs-value">16</span>
      <button type="button" id="fs-plus">A+</button>
    </div>
  </div>
  <div class="tr-setting-row">
    <div class="tr-setting-label">行高</div>
    <div class="tr-setting-controls">
      <button type="button" id="lh-btn">1.9</button>
    </div>
  </div>
  <div class="tr-setting-row">
    <div class="tr-setting-label">主题</div>
    <div class="tr-theme-row">
      <button type="button" data-theme="light">浅色</button>
      <button type="button" data-theme="dark">深色</button>
      <button type="button" data-theme="sepia">护眼</button>
    </div>
  </div>
</div>

<script>
  window.__FILE_URL__ = {{ file_url|tojson }};
  window.__FILENAME__ = {{ filename|tojson }};
</script>
<script defer src="{{ url_for('static', filename='js/txt_reader.js', v=VERSION) }}"></script>

</body>
</html>
